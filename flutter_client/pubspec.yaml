name: autocall_client
description: Smart customer support — receive auto-calls (Bangla EMI reminders) over WebRTC.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  socket_io_client: ^2.0.3+1
  flutter_webrtc: ^0.12.5
  permission_handler: ^11.3.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_callkit_incoming: ^2.0.4+1
  uuid: ^4.3.3
  # Firebase (commented out — enable after running `flutterfire configure`)
  # firebase_core: ^2.27.0
  # firebase_messaging: ^14.7.20

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
