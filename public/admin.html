<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AutoCall Admin Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  header {
    background: #1e293b; padding: 1rem 2rem; border-bottom: 1px solid #334155;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 1.25rem; }
  header .stats { display: flex; gap: 1.5rem; font-size: 13px; color: #94a3b8; }
  header .stats b { color: #22c55e; }
  main { padding: 2rem; max-width: 1280px; margin: 0 auto; display: grid; gap: 1.5rem; grid-template-columns: 1fr 380px; }
  .panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.25rem; }
  .panel h2 { font-size: 1rem; margin-bottom: 1rem; color: #cbd5e1; }
  button {
    background: #2563eb; color: white; border: 0; padding: 8px 14px;
    border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #1d4ed8; }
  button.danger { background: #dc2626; } button.danger:hover { background: #b91c1c; }
  button.success { background: #16a34a; } button.success:hover { background: #15803d; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, select {
    background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
    padding: 8px 10px; border-radius: 6px; font-size: 13px; width: 100%;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #334155; }
  th { color: #94a3b8; font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .on { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .off { background: #64748b; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .due { background: #ef444422; color: #f87171; }
  .ok  { background: #22c55e22; color: #4ade80; }
  #log { font-family: monospace; font-size: 11px; max-height: 220px; overflow-y: auto;
         background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: .5rem; }
  #log div { padding: 2px 0; border-bottom: 1px dashed #1e293b; }
  #login { max-width: 380px; margin: 6rem auto; }
  .row { display: flex; gap: .5rem; align-items: center; margin-bottom: .75rem; }
  .row label { min-width: 90px; color: #94a3b8; font-size: 13px; }
  .hidden { display: none !important; }
  #call-status {
    padding: 1rem; background: #0f172a; border: 2px solid #334155; border-radius: 8px;
    text-align: center; margin-bottom: 1rem;
  }
  #call-status.ringing { border-color: #facc15; animation: pulse 1s infinite; }
  #call-status.active  { border-color: #22c55e; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
</style>
</head>
<body>

<!-- LOGIN VIEW -->
<div id="login" class="panel">
  <h2>Admin Login</h2>
  <div class="row"><label>Username</label><input id="u" value="admin"/></div>
  <div class="row"><label>Password</label><input id="p" type="password" value="admin123"/></div>
  <button onclick="doLogin()" style="width:100%">Login</button>
  <p id="loginErr" style="color:#f87171;margin-top:.5rem;font-size:12px"></p>
</div>

<!-- DASHBOARD -->
<header class="hidden" id="topbar">
  <h1>AutoCall Panel <span style="color:#64748b;font-size:13px">— <span id="adminName"></span></span></h1>
  <div class="stats">
    <span>Online: <b id="s-online">0</b></span>
    <span>Active calls: <b id="s-active">0</b></span>
    <span>Pending: <b id="s-pending">0</b></span>
    <span>Answered: <b id="s-answered">0</b></span>
    <button onclick="logout()" style="background:#475569">Logout</button>
  </div>
</header>

<main class="hidden" id="dash">

  <section class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <h2 style="margin:0">Customers</h2>
      <div>
        <button class="success" onclick="emiAutoCall()">Auto-Call All EMI Due</button>
        <button onclick="loadUsers()">Refresh</button>
      </div>
    </div>
    <table id="userTable">
      <thead>
        <tr><th>Name</th><th>Phone</th><th>EMI Date</th><th>Outstanding</th><th>Status</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <aside style="display:flex;flex-direction:column;gap:1rem">
    <div class="panel">
      <h2>Live Call</h2>
      <div id="call-status">No active call</div>
      <div id="call-controls" class="hidden">
        <div style="margin-bottom:.5rem">
          <label style="font-size:12px;color:#94a3b8">TTS message (Bangla / English)</label>
          <textarea id="ttsText" rows="2" style="width:100%;background:#0f172a;color:#e2e8f0;border:1px solid #334155;padding:8px 10px;border-radius:6px;font-size:13px;resize:vertical;margin-top:.25rem"
            placeholder="যেমন: স্যার আপনার ২টা EMI বাকি আছে">স্যার আপনার ২টা EMI বাকি আছে</textarea>
          <div class="row" style="margin:.4rem 0">
            <label style="min-width:55px">Lang</label>
            <select id="ttsLang" style="width:auto;flex:0 0 110px">
              <option value="bn" selected>Bangla</option>
              <option value="en">English</option>
              <option value="hi">Hindi</option>
            </select>
            <button id="speakBtn" class="success" onclick="speakTTS()" style="flex:1">🔊 Speak to user</button>
          </div>
          <div style="display:flex;gap:.4rem;align-items:center;font-size:11px;color:#94a3b8">
            <input type="checkbox" id="muteMic" onchange="toggleMicMute()" style="width:auto"/>
            <label for="muteMic">Mute my mic while TTS plays</label>
          </div>
        </div>
        <button class="danger" onclick="endCall()" style="width:100%">End Call</button>
      </div>
      <audio id="remoteAudio" autoplay></audio>
    </div>

    <div class="panel" id="adminPanel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
        <h2 style="margin:0">Admin Users</h2>
        <button onclick="toggleAdminForm()" id="addAdminBtn">+ Add</button>
      </div>
      <div id="addAdminForm" class="hidden" style="margin-bottom:.75rem">
        <input id="newAdminUser" placeholder="username" style="margin-bottom:.4rem"/>
        <input id="newAdminPass" type="password" placeholder="password (min 6)" style="margin-bottom:.4rem"/>
        <input id="newAdminName" placeholder="display name" style="margin-bottom:.4rem"/>
        <select id="newAdminRole" style="margin-bottom:.4rem">
          <option value="agent">Agent</option>
          <option value="superadmin">Super Admin</option>
        </select>
        <button class="success" onclick="createAdmin()" style="width:100%">Create</button>
        <p id="adminFormErr" style="color:#f87171;font-size:11px;margin-top:.4rem"></p>
      </div>
      <div id="adminList" style="font-size:12px"></div>
    </div>

    <div class="panel">
      <h2>Activity Log</h2>
      <div id="log"></div>
    </div>
  </aside>

</main>

<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<script>
//─────────────────────────────────────────────────────────────────────
// State
//─────────────────────────────────────────────────────────────────────
let token = localStorage.getItem('token');
let admin = null;
let socket = null;
let pc = null;          // RTCPeerConnection (admin side)
let localStream = null; // mic
let currentCall = null; // { callId, userId }
let iceServers = [];

// TTS / audio-mixing
let audioCtx = null;
let micSource = null;
let micGain = null;
let ttsGain = null;
let mixDest = null;     // MediaStreamAudioDestinationNode → sent to peer
let mixedTrack = null;

const $  = id => document.getElementById(id);
const log = (m, c='#94a3b8') => {
  const d = document.createElement('div');
  d.innerHTML = `<span style="color:#64748b">${new Date().toLocaleTimeString()}</span> <span style="color:${c}">${m}</span>`;
  $('log').prepend(d);
};

//─────────────────────────────────────────────────────────────────────
// Auth
//─────────────────────────────────────────────────────────────────────
async function doLogin() {
  const username = $('u').value, password = $('p').value;
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const d = await r.json();
    if (!r.ok) { $('loginErr').textContent = d.error; return; }
    token = d.token; admin = d.admin;
    localStorage.setItem('token', token);
    localStorage.setItem('admin', JSON.stringify(admin));
    bootDashboard();
  } catch (e) { $('loginErr').textContent = e.message; }
}

function logout() {
  localStorage.clear();
  if (socket) socket.disconnect();
  location.reload();
}

async function bootDashboard() {
  admin = admin || JSON.parse(localStorage.getItem('admin') || 'null');
  if (!admin) return;
  $('adminName').textContent = admin.name;
  $('login').classList.add('hidden');
  $('topbar').classList.remove('hidden');
  $('dash').classList.remove('hidden');

  // Load ICE servers
  const r = await fetch('/api/ice-servers');
  iceServers = (await r.json()).iceServers;
  log(`ICE servers loaded (${iceServers.length})`);

  connectSocket();
  loadUsers();
  setInterval(loadUsers, 15000);
  loadAdmins();
}

//─────────────────────────────────────────────────────────────────────
// Socket
//─────────────────────────────────────────────────────────────────────
function connectSocket() {
  socket = io({ transports: ['websocket', 'polling'] });

  socket.on('connect', () => {
    log('Socket connected: ' + socket.id, '#4ade80');
    socket.emit('register_admin', { adminId: admin.id, name: admin.name });
  });

  socket.on('admin_registered', d => updateStats(d.stats));
  socket.on('stats_update',     updateStats);
  socket.on('user_online',  d => { log(`▲ user online: ${d.userId}`, '#4ade80'); loadUsers(); });
  socket.on('user_offline', d => { log(`▼ user offline: ${d.userId}`, '#94a3b8'); loadUsers(); });

  socket.on('call_ringing',  d => { setCallStatus('ringing', `Ringing ${d.userId}…`); log(`📞 Ringing ${d.userId}`, '#facc15'); });
  socket.on('call_queued',   d => log(`⏸ Queued ${d.userId} (offline)`, '#94a3b8'));
  socket.on('call_answered', d => {
    setCallStatus('active', `Connected to ${d.userId}`);
    log(`✓ Answered by ${d.userId}`, '#4ade80');
    startWebRTC(currentCall.callId);
  });
  socket.on('call_missed',   d => { setCallStatus('idle', 'No active call'); cleanupRTC(); log(`✗ Missed: ${d.reason}`, '#f87171'); });
  socket.on('call_rejected', d => { setCallStatus('idle', 'No active call'); cleanupRTC(); log(`✗ Rejected by ${d.userId}`, '#f87171'); });
  socket.on('call_ended',    d => { setCallStatus('idle', 'No active call'); cleanupRTC(); log(`■ Call ended (${d.duration||0}s)`, '#94a3b8'); });

  // WebRTC signaling FROM Flutter user
  socket.on('webrtc_answer', async d => {
    if (!pc) return;
    await pc.setRemoteDescription(new RTCSessionDescription(d.sdp));
    log('WebRTC answer received');
  });
  socket.on('ice_candidate', async d => {
    if (!pc || !d.candidate) return;
    try { await pc.addIceCandidate(new RTCIceCandidate(d.candidate)); }
    catch (e) { log('ICE add failed: ' + e.message, '#f87171'); }
  });

  socket.on('error_event', d => log('Error: ' + d.error, '#f87171'));
  socket.on('disconnect', () => log('Socket disconnected', '#f87171'));
}

function updateStats(s) {
  if (!s) return;
  $('s-online').textContent   = s.onlineUsers;
  $('s-active').textContent   = s.activeCalls;
  $('s-pending').textContent  = s.pendingCalls;
  $('s-answered').textContent = s.history?.answered ?? 0;
}

//─────────────────────────────────────────────────────────────────────
// Users
//─────────────────────────────────────────────────────────────────────
async function loadUsers() {
  const r = await fetch('/api/users', { headers: { Authorization: 'Bearer ' + token } });
  if (r.status === 401) return logout();
  const users = await r.json();
  const tbody = document.querySelector('#userTable tbody');
  tbody.innerHTML = '';
  const today = new Date(); today.setHours(0,0,0,0);
  for (const u of users) {
    const due = u.emiDate ? Math.round((new Date(u.emiDate)-today)/86400000) : null;
    const dueBadge = due !== null && due <= 1
      ? `<span class="badge due">EMI ${due<=0?'overdue':due+'d'}</span>`
      : `<span class="badge ok">${due}d</span>`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${u.name}</td>
      <td>${u.phone}</td>
      <td>${u.emiDate||'-'} ${dueBadge}</td>
      <td>৳${(u.outstanding||0).toLocaleString()}</td>
      <td><span class="dot ${u.online?'on':'off'}"></span>${u.online?'Online':'Offline'}</td>
      <td><button onclick="callUser('${u.id}')" ${!u.online?'disabled':''}>Call</button></td>`;
    tbody.appendChild(tr);
  }
}

//─────────────────────────────────────────────────────────────────────
// Calling
//─────────────────────────────────────────────────────────────────────
async function callUser(userId) {
  if (currentCall) return alert('Already in a call');
  // Acquire mic FIRST (browser policy)
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (e) {
    alert('Microphone access required: ' + e.message); return;
  }

  // Build the audio mix bus NOW while we still have a user-gesture context
  // (otherwise AudioContext stays suspended and the outgoing track is silent).
  buildMixBus();
  try { if (audioCtx.state === 'suspended') await audioCtx.resume(); } catch {}

  // Generate callId via socket initiate
  socket.emit('initiate_call', { userId, autoMessage: true, callerName: admin.name });
  // We need the callId — the server emits call_ringing back; capture it.
  const onRing = d => {
    if (d.userId !== userId) return;
    socket.off('call_ringing', onRing);
    currentCall = { callId: d.callId, userId };
    setCallStatus('ringing', `Ringing ${userId}…`);
    log(`→ Calling ${userId} [${d.callId.slice(0,8)}]`, '#facc15');
  };
  socket.on('call_ringing', onRing);
}

async function emiAutoCall() {
  if (!confirm('Call ALL users with EMI due today/tomorrow?')) return;
  const r = await fetch('/api/calls/emi-auto-call', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ daysAhead: 1 })
  });
  const d = await r.json();
  log(`Bulk EMI call: ${d.count} users`, '#4ade80');
}

function setCallStatus(state, text) {
  const el = $('call-status');
  el.className = state;
  el.textContent = text;
  $('call-controls').classList.toggle('hidden', state === 'idle');
  if (state === 'idle') currentCall = null;
}

function endCall() {
  if (!currentCall) return;
  socket.emit('end_call', { callId: currentCall.callId, reason: 'admin_ended' });
  cleanupRTC();
  setCallStatus('idle', 'No active call');
}

//─────────────────────────────────────────────────────────────────────
// WebRTC (admin sends mic → Flutter user listens)
//─────────────────────────────────────────────────────────────────────
async function startWebRTC(callId) {
  pc = new RTCPeerConnection({ iceServers });

  // Mix bus already built in callUser() — fall back if missing.
  if (!mixedTrack) buildMixBus();
  if (audioCtx && audioCtx.state === 'suspended') {
    try { await audioCtx.resume(); } catch (e) { log('AudioCtx resume err: '+e.message,'#f87171'); }
  }
  pc.addTrack(mixedTrack, mixDest.stream);

  pc.ontrack = e => {
    $('remoteAudio').srcObject = e.streams[0];
    log('Remote audio attached', '#4ade80');
  };

  pc.onicecandidate = e => {
    if (e.candidate) socket.emit('ice_candidate', { callId, candidate: e.candidate });
  };

  pc.onconnectionstatechange = () => {
    log('PC state: ' + pc.connectionState);
    if (pc.connectionState === 'failed') socket.emit('ice_restart', { callId });
  };

  const offer = await pc.createOffer({ offerToReceiveAudio: true });
  await pc.setLocalDescription(offer);
  socket.emit('webrtc_offer', { callId, sdp: offer });
  log('WebRTC offer sent');
}

function cleanupRTC() {
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  try { mixedTrack?.stop(); } catch {}
  mixedTrack = null; mixDest = null; micSource = null; micGain = null; ttsGain = null;
  if (audioCtx) { try { audioCtx.close(); } catch {} audioCtx = null; }
  $('remoteAudio').srcObject = null;
}

//─────────────────────────────────────────────────────────────────────
// Audio mix bus (mic + TTS → WebRTC track)
//─────────────────────────────────────────────────────────────────────
function buildMixBus() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  mixDest  = audioCtx.createMediaStreamDestination();

  micSource = audioCtx.createMediaStreamSource(localStream);
  micGain   = audioCtx.createGain();
  micGain.gain.value = 1.0;
  micSource.connect(micGain).connect(mixDest);

  ttsGain = audioCtx.createGain();
  ttsGain.gain.value = 1.0;
  ttsGain.connect(mixDest);

  mixedTrack = mixDest.stream.getAudioTracks()[0];
}

function toggleMicMute() {
  if (!micGain) return;
  micGain.gain.value = $('muteMic').checked ? 0 : 1;
}

async function speakTTS() {
  const text = $('ttsText').value.trim();
  const lang = $('ttsLang').value;
  if (!text) return;
  if (!currentCall || !audioCtx) {
    alert('Start a call first.');
    return;
  }
  const btn = $('speakBtn');
  btn.disabled = true; btn.textContent = '⏳ Loading…';
  try {
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    const r = await fetch(`/api/tts?text=${encodeURIComponent(text)}&lang=${encodeURIComponent(lang)}`);
    if (!r.ok) throw new Error('TTS HTTP ' + r.status);
    const buf = await r.arrayBuffer();
    const audioBuf = await audioCtx.decodeAudioData(buf);
    const src = audioCtx.createBufferSource();
    src.buffer = audioBuf;
    src.connect(ttsGain);
    btn.textContent = '🔊 Speaking…';
    src.start();
    src.onended = () => {
      btn.disabled = false; btn.textContent = '🔊 Speak to user';
      log('TTS finished', '#4ade80');
    };
    log(`TTS playing: "${text.slice(0,40)}${text.length>40?'…':''}"`, '#4ade80');
  } catch (e) {
    btn.disabled = false; btn.textContent = '🔊 Speak to user';
    log('TTS error: ' + e.message, '#f87171');
    alert('TTS failed: ' + e.message);
  }
}

// Auto-resume session
if (token) bootDashboard();

//─────────────────────────────────────────────────────────────────────
// Admin management (superadmin only)
//─────────────────────────────────────────────────────────────────────
async function loadAdmins() {
  if (admin?.role !== 'superadmin') {
    $('adminPanel').classList.add('hidden');
    return;
  }
  try {
    const r = await fetch('/api/admins', { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) return;
    const list = await r.json();
    $('adminList').innerHTML = list.map(a => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #334155">
        <div>
          <div style="font-weight:600">${a.username}</div>
          <div style="color:#64748b;font-size:11px">${a.role} ${a.id===admin.id?'(you)':''}</div>
        </div>
        ${a.id===admin.id ? '' : `<button class="danger" style="padding:4px 8px;font-size:11px" onclick="deleteAdmin('${a.id}','${a.username}')">×</button>`}
      </div>`).join('');
  } catch (e) { log('loadAdmins err: ' + e.message, '#f87171'); }
}

function toggleAdminForm() {
  $('addAdminForm').classList.toggle('hidden');
}

async function createAdmin() {
  const username = $('newAdminUser').value.trim();
  const password = $('newAdminPass').value;
  const name     = $('newAdminName').value.trim() || username;
  const role     = $('newAdminRole').value;
  $('adminFormErr').textContent = '';
  if (!username || !password) { $('adminFormErr').textContent = 'username + password required'; return; }
  const r = await fetch('/api/admins', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ username, password, name, role }),
  });
  const d = await r.json();
  if (!r.ok) { $('adminFormErr').textContent = d.error; return; }
  log(`Admin created: ${username} (${role})`, '#4ade80');
  $('newAdminUser').value = ''; $('newAdminPass').value = ''; $('newAdminName').value = '';
  toggleAdminForm();
  loadAdmins();
}

async function deleteAdmin(id, username) {
  if (!confirm(`Delete admin "${username}"?`)) return;
  const r = await fetch('/api/admins/' + id, {
    method: 'DELETE', headers: { Authorization: 'Bearer ' + token }
  });
  if (r.ok) { log(`Admin deleted: ${username}`, '#f87171'); loadAdmins(); }
  else { const d = await r.json(); alert(d.error); }
}
</script>
</body>
</html>
